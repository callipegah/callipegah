<text x="28" y="112" class="m" font-size="14.5" fill="#cbd5e1">Lab report in, weekly meal plan out. Unit</text><text x="28" y="136" class="m" font-size="14.5" fill="#cbd5e1">conversions derived from molar mass, not copied;</text><text x="28" y="160" class="m" font-size="14.5" fill="#cbd5e1">a solver plans meals; the LLM only explains.</text>
