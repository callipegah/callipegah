<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pegah Davari: backend and agentic systems engineer, learning AI in public">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
      .flow.slow { animation-duration: 3s; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulse.d1 { animation-delay: .5s; } .pulse.d2 { animation-delay: 1s; } .pulse.d3 { animation-delay: 1.5s; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .flicker { animation: flicker 6s linear infinite; }
      @keyframes flicker { 0%,92%,96%,100% { opacity: 1; } 94% { opacity: .55; } 95% { opacity: .9; } }
      .type { clip-path: inset(0 100% 0 0); animation: type 3.2s steps(46) .4s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="22" fill="#05060a"/>
  <rect width="1200" height="400" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="21" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- window chrome -->
  <g transform="translate(34 32)">
    <circle r="6" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="22" r="6" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="44" r="6" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="70" y="5" class="mono" font-size="14" fill="#6b7280">~/callipegah — zsh</text>
  </g>

  <!-- left: text -->
  <g transform="translate(70 0)">
    <text x="0" y="118" class="mono" font-size="20" fill="#22d3ee" opacity=".9">$ whoami</text>
    <g class="flicker" filter="url(#glow)">
      <text x="-4" y="198" class="sans" font-size="78" font-weight="700" letter-spacing="1"
            fill="none" stroke="url(#neon)" stroke-width="2">pegah davari</text>
    </g>
    <g class="type">
      <text x="0" y="248" class="mono" font-size="22" fill="#e5e7eb">backend &amp; agentic systems · learning AI in public</text>
    </g>
    <text x="0" y="292" class="mono" font-size="17" fill="#9ca3af">wonders about everything · gets ideas from anything</text>
    <text x="0" y="318" class="mono" font-size="17" fill="#9ca3af">· does it by hand twice, then builds the tool</text>
    <g transform="translate(0 352)">
      <text class="mono" font-size="16" fill="#a3e635">●</text>
      <text x="22" class="mono" font-size="16" fill="#d1d5db">currently shipping: Relokit · youtube-digest · an LLM analytics agent</text>
      <rect x="672" y="-15" width="10" height="19" fill="#a3e635" class="caret"/>
    </g>
  </g>

  <!-- right: agent pipeline doodle -->
  <g transform="translate(880 70)" filter="url(#soft)" fill="none" stroke-width="1.6">
    <!-- links -->
    <path d="M60 40 C 120 40, 120 120, 180 120" stroke="#22d3ee" class="flow"/>
    <path d="M60 200 C 120 200, 120 120, 180 120" stroke="#f472b6" class="flow"/>
    <path d="M230 120 C 270 120, 270 230, 230 250" stroke="#a78bfa" class="flow slow"/>
    <path d="M180 250 L 70 250" stroke="#a3e635" class="flow"/>
    <!-- nodes -->
    <rect x="0" y="22" width="60" height="36" rx="8" stroke="#22d3ee"/>
    <rect x="0" y="182" width="60" height="36" rx="8" stroke="#f472b6"/>
    <circle cx="205" cy="120" r="25" stroke="#a78bfa"/>
    <rect x="180" y="232" width="50" height="36" rx="8" stroke="#a78bfa"/>
    <rect x="0" y="232" width="70" height="36" rx="8" stroke="#a3e635"/>
  </g>
  <g transform="translate(880 70)" class="mono" font-size="12" text-anchor="middle">
    <text x="30" y="44" fill="#67e8f9">data</text>
    <text x="30" y="204" fill="#f9a8d4">idea</text>
    <text x="205" y="124" fill="#c4b5fd">agent</text>
    <text x="205" y="254" fill="#c4b5fd">judge</text>
    <text x="35" y="254" fill="#bef264">ship it</text>
    <circle cx="205" cy="120" r="4" fill="#a78bfa" class="pulse"/>
  </g>
  <g transform="translate(880 70)">
    <circle cx="30" cy="300" r="3.5" fill="#22d3ee" class="pulse"/>
    <circle cx="60" cy="300" r="3.5" fill="#a78bfa" class="pulse d1"/>
    <circle cx="90" cy="300" r="3.5" fill="#f472b6" class="pulse d2"/>
    <circle cx="120" cy="300" r="3.5" fill="#a3e635" class="pulse d3"/>
    <text x="140" y="305" class="mono" font-size="12" fill="#6b7280">thinking…</text>
  </g>
</svg>
